[package]
name = "ssx-assets"
description = "Asset pipeline: disc/archive extraction, manifests and conversion of SSX (2012) data into engine-ready form."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["pipeline", "movie-decode", "shader"]
pipeline = ["dep:ssx-content", "dep:blake3", "dep:ssx-lua", "dep:glam", "dep:memmap2", "dep:png", "dep:serde", "dep:toml"]
shader = ["pipeline", "ssx-content/shader"]
movie-decode = ["pipeline", "dep:ssx-movie"]

[dependencies]
ssx-content = { workspace = true, optional = true }
ssx-movie = { workspace = true, optional = true }
ssx-formats.workspace = true
ssx-files.workspace = true
ssx-core.workspace = true
ssx-lua = { workspace = true, optional = true }
ssx-rules.workspace = true
anyhow.workspace = true
blake3 = { workspace = true, optional = true }
glam = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
png = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json.workspace = true
toml = { workspace = true, optional = true }

[dev-dependencies]
ssx-core = { workspace = true, features = ["dev-master"] }
ssx-formats = { workspace = true, features = ["test-fixtures"] }

[lints]
workspace = true
